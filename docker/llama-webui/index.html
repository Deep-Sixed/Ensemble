<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ensemble</title>
    <link rel="icon" type="image/png" href="./assets/ensemble.png" />
    <link rel="apple-touch-icon" href="./assets/ensemble.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="./bundle.js" rel="modulepreload">
    <link href="./bundle.css" rel="stylesheet">
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">
      <script>
        {
          const defaultModel = "qwen2.5-coder-7b-instruct-q4_k_m";
          const nativeFetch = window.fetch.bind(window);

          function normalizeModelUrl(input) {
            if (typeof input !== "string") {
              return input;
            }

            const url = new URL(input, window.location.href);
            if (url.searchParams.get("model") === "default") {
              url.searchParams.set("model", defaultModel);
              return url.pathname + url.search + url.hash;
            }

            return input;
          }

          function normalizeRequestBody(init) {
            if (!init || typeof init.body !== "string") {
              return init;
            }

            try {
              const payload = JSON.parse(init.body);
              if (payload && payload.model === "default") {
                return {
                  ...init,
                  body: JSON.stringify({
                    ...payload,
                    model: defaultModel
                  })
                };
              }
            } catch {
              return init;
            }

            return init;
          }

          function normalizeModelList(payload) {
            if (!payload || !Array.isArray(payload.data)) {
              return payload;
            }

            return {
              ...payload,
              data: payload.data.filter((model) => model.id !== "default")
            };
          }

          window.fetch = async (input, init) => {
            const normalizedInput = normalizeModelUrl(input);
            const response = await nativeFetch(
              normalizedInput,
              normalizeRequestBody(init)
            );

            const url = new URL(
              typeof normalizedInput === "string"
                ? normalizedInput
                : normalizedInput.url,
              window.location.href
            );

            if (url.pathname !== "/v1/models" && url.pathname !== "/models") {
              return response;
            }

            const payload = normalizeModelList(await response.clone().json());
            return new Response(JSON.stringify(payload), {
              status: response.status,
              statusText: response.statusText,
              headers: response.headers
            });
          };

          __sveltekit__ = {
            base: new URL('.', location).pathname.slice(0, -1)
          };

          const element = document.currentScript.parentElement;

          import("./bundle.js").then((app) => {
            app.start(element)
          });
        }
      </script>
    </div>
  </body>
</html>
