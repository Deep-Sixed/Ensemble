services:
  llm:
    build:
      context: .
      dockerfile: docker/llama-cpp-python.Dockerfile
    ports:
      - "${ENSEMBLE_SERVER_PORT:-8888}:8888"
    volumes:
      - ${ENSEMBLE_HOST_MODEL_DIR:-/opt/ensemble/models}:/models:ro
    environment:
      MODEL: "${ENSEMBLE_MODEL_PATH:-/models/qwen3-4b-instruct-2507-ud-q4_k_xl.gguf}"
      MODEL_ALIAS: "${ENSEMBLE_MODEL_ALIAS:-qwen3-4b-instruct-2507-ud-q4_k_xl}"
      HOST: "${ENSEMBLE_SERVER_HOST:-0.0.0.0}"
      PORT: "8888"
      N_CTX: "${ENSEMBLE_N_CTX:-32768}"
      N_THREADS: "${ENSEMBLE_N_THREADS:-6}"
    restart: unless-stopped
    command:
      - python
      - -m
      - llama_cpp.server
      - --model
      - "${ENSEMBLE_MODEL_PATH:-/models/qwen3-4b-instruct-2507-ud-q4_k_xl.gguf}"
      - --model_alias
      - "${ENSEMBLE_MODEL_ALIAS:-qwen3-4b-instruct-2507-ud-q4_k_xl}"
      - --host
      - "${ENSEMBLE_SERVER_HOST:-0.0.0.0}"
      - --port
      - "8888"
      - --n_ctx
      - "${ENSEMBLE_N_CTX:-32768}"
      - --n_threads
      - "${ENSEMBLE_N_THREADS:-6}"

  agent:
    build:
      context: .
      dockerfile: docker/agent.Dockerfile
    profiles:
      - agent
    depends_on:
      - llm
    environment:
      ENSEMBLE_LLM_BASE_URL: http://llm:8888/v1
      ENSEMBLE_LLM_MODEL: "${ENSEMBLE_LLM_MODEL:-qwen3-4b-instruct-2507-ud-q4_k_xl}"
      ENSEMBLE_API_KEY: "${ENSEMBLE_API_KEY:-ensemble}"
      ENSEMBLE_WORKSPACE: /workspace
      ENSEMBLE_ALLOW_WRITES: "${ENSEMBLE_ALLOW_WRITES:-false}"
      ENSEMBLE_ALLOW_SHELL: "${ENSEMBLE_ALLOW_SHELL:-false}"
      ENSEMBLE_MAX_FILE_BYTES: "${ENSEMBLE_MAX_FILE_BYTES:-200000}"
    volumes:
      - .:/app
      - ${ENSEMBLE_WORKSPACE:-/opt/workspace}:/workspace:ro
    working_dir: /app
    command: ["ensemble", "chat", "--classic"]
