[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "local-first"
version = "0.1.0"
description = "Lean local AI dev substrate for local inference, MCP config, and skills."
readme = "README.md"
requires-python = ">=3.15,<3.16"
dependencies = [
    "langchain-core>=1.0,<2.0",
    "langchain-openai>=1.0,<2.0",
    "langchain-mcp-adapters>=0.2,<1.0",
    "python-dotenv>=1.0.0",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
local-first = "local_first.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/local_first"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
