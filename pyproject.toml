[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ensemble"
version = "0.1.0"
description = "Local AI substrate for intelligent development systems."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "langchain-core>=1.0,<2.0",
    "langchain-openai>=1.0,<2.0",
    "langchain-mcp-adapters>=0.2,<1.0",
    "python-dotenv>=1.0.0",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
ensemble = "ensemble.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ensemble"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
