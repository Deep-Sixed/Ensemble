[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ensemble"
version = "0.1.0"
description = "Local AI substrate for intelligent development systems."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14,<3.15"
dependencies = [
    "python-dotenv>=1.0.0,<2.0",
    "requests>=2.32,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[project.scripts]
ensemble = "ensemble.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ensemble"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
