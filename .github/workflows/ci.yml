name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest

  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ensemble-vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ensemble-vscode/.nvmrc
          cache: npm
          cache-dependency-path: ensemble-vscode/package-lock.json
      - name: Install
        run: npm ci
      - name: Check
        run: npm run check
      - name: Compile
        run: npm run compile
